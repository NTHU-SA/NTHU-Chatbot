# Lint + tests (including the Firestore emulator) for every PR and every push to main / dev.
# Third-party actions are pinned to commit SHAs; the comment shows the release tag.
name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Firestore emulator: firebase-tools needs Node, the emulator itself needs Java 21+
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies (hash-verified)
        run: pip install --disable-pip-version-check --require-hashes -r requirements-dev.txt

      - name: Check lock files are up to date
        run: |
          pip install --disable-pip-version-check "uv==0.12.22"
          # Start from the committed locks so uv keeps their pins; only .in edits change the result
          cp requirements.txt requirements-dev.txt /tmp/
          uv pip compile requirements.in --universal --generate-hashes --python-version 3.12 -q -o /tmp/requirements.txt
          uv pip compile requirements-dev.in --universal --generate-hashes --python-version 3.12 -q -o /tmp/requirements-dev.txt
          diff <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/requirements.txt)
          diff <(grep -v '^#' requirements-dev.txt) <(grep -v '^#' /tmp/requirements-dev.txt)

      - name: Lint
        run: ruff check .

      - name: Test with Firestore emulator
        run: >
          npx --yes firebase-tools@15.32.1 emulators:exec --only firestore --project demo-nthu-chatbot
          "python -m pytest -q --cov --cov-report=term"

  # Deploy the LIFF frontend to Firebase Hosting after tests pass on a push to dev (staging)
  # or main (prod). Credentials come from Workload Identity Federation — no keys are stored;
  # GCP only trusts this repository on the branch configured in infra/environments/*.conf.
  # Skipped until the repo variables printed by infra/bootstrap.sh are set.
  deploy-frontend:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      TARGET: ${{ github.ref == 'refs/heads/main' && 'prod' || 'staging' }}
      WIF_PROVIDER: ${{ github.ref == 'refs/heads/main' && vars.GCP_WIF_PROVIDER_PROD || vars.GCP_WIF_PROVIDER_STAGING }}
      HOSTING_SA: ${{ github.ref == 'refs/heads/main' && vars.GCP_HOSTING_SA_PROD || vars.GCP_HOSTING_SA_STAGING }}
    steps:
      - name: Check deployment is configured
        id: configured
        run: |
          if [ -n "$WIF_PROVIDER" ] && [ -n "$HOSTING_SA" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Frontend deploy for $TARGET is not configured yet (repo variables missing)."
          fi

      - if: steps.configured.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: steps.configured.outputs.ok == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - if: steps.configured.outputs.ok == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - if: steps.configured.outputs.ok == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.HOSTING_SA }}

      - if: steps.configured.outputs.ok == 'true'
        name: Build and deploy to Firebase Hosting
        run: |
          conf="infra/environments/${TARGET}.conf"
          project="$(grep -E '^PROJECT_ID=' "$conf" | cut -d= -f2)"
          python infra/build_frontend.py "$conf"
          npx --yes firebase-tools@15.32.1 deploy --only hosting --non-interactive \
            --project "$project" --config "build/frontend-${TARGET}/firebase.json"
