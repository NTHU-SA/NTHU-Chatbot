# prod：版本 tag（vX.Y.Z）→ 和 staging 同一個 GCP 專案（nthusa-chatbot），但所有資源分開命名：
# Firestore 資料庫、Secret、service account、WIF pool、Cloud Run 服務與 Hosting 網站都是 prod 專用，
# 權限也只授予這一份（見 infra/bootstrap.sh）。
# 正式的 LINE Login channel 必須和 Messaging API channel 在同一個 Provider，
# 否則 LIFF 的 sub 會和 webhook 的 userId 不同，同一個人會變成兩個使用者。
# LINE 的 ID（LINE_LOGIN_CHANNEL_ID、LIFF_ID）不寫在 repo：後端在 Cloud Run 環境變數，
# 前端部署用 GitHub repo variable `LIFF_ID_{env}`（見 infra/README.md「LINE 頻道設定」）。
PROJECT_ID=nthusa-chatbot
REGION=asia-northeast1
SERVICE=nthu-chatbot
GITHUB_OWNER=NTHU-SA
GITHUB_REPO=NTHU-Chatbot
# 打版本 tag 才部署；不重新建置，沿用 staging 為同一個 commit 建的映像（cloudbuild.release.yaml）
TAG_REGEX='^v[0-9]+\.[0-9]+\.[0-9]+$'
BUILD_CONFIG=cloudbuild.release.yaml
SOURCE_SERVICE=nthu-chatbot-staging
OPENAI_MODEL=gpt-6-luna
MAX_INSTANCES=4
DELETE_PROTECTION=true
# 與 staging 分開的資源
FIRESTORE_DATABASE=prod
SECRET_SUFFIX=-prod
RUNTIME_SA_NAME=nthu-chatbot-prod
DEPLOYER_SA_NAME=nthu-chatbot-prod-deployer
HOSTING_SA_NAME=nthu-chatbot-prod-hosting
# 獨立的 WIF pool：principalSet 是以 pool 為範圍，和 staging 共用 pool 時 main 的 token 也能代理 prod 的 SA
WIF_POOL=github-actions-prod
# 前端（Firebase Hosting）：網站 <HOSTING_SITE>.web.app 透過 CORS 呼叫 API_ORIGIN
API_ORIGIN=https://nthu-chatbot-1008940193124.asia-northeast1.run.app
HOSTING_SITE=nthusa-chatbot-prod
# 正式網址（Firebase Hosting 自訂網域；DNS 在 Cloudflare，需設為 DNS only）
CUSTOM_DOMAIN=chat.nthusa.tw
# Auth0（一般瀏覽器登入）：學生會的 tenant（custom domain）與 prod 專用的 API audience；
# Client ID 不寫在 repo（Cloud Run 環境變數與 repo variable AUTH0_CLIENT_ID_PROD）
AUTH0_DOMAIN=auth.nthusa.tw
AUTH0_AUDIENCE=https://chat.nthusa.tw/api
# 結尾的 * 表示前綴比對：任何 v 開頭的 tag（誰能建立由 GitHub 的 tag ruleset 限制）
DEPLOY_REF='refs/tags/v*'
# 網路搜尋（只搜 nthu.edu.tw）：每次搜尋另外計費
WEB_SEARCH_ENABLED=true
