# prod：main 分支 → 獨立的 GCP 專案。REPLACE_ME 的欄位要先填好，腳本才會執行。
# 正式的 LINE Login channel 必須和 Messaging API channel 在同一個 Provider，
# 否則 LIFF 的 sub 會和 webhook 的 userId 不同，同一個人會變成兩個使用者。
PROJECT_ID=REPLACE_ME
REGION=asia-northeast1
SERVICE=nthu-chatbot
GITHUB_OWNER=NTHU-SA
GITHUB_REPO=NTHU-Chatbot
BRANCH_REGEX='^main$'
LINE_LOGIN_CHANNEL_ID=REPLACE_ME
LIFF_ID=REPLACE_ME
OPENAI_MODEL=gpt-5.6-luna
MAX_INSTANCES=4
DELETE_PROTECTION=true
