# staging：dev 分支 → nthusa-chatbot（東京）。這裡只放非機密、與 LINE 頻道無關的設定。
# LINE 的 ID（LINE_LOGIN_CHANNEL_ID、LIFF_ID）不寫在 repo：後端在 Cloud Run 環境變數，
# 前端部署用 GitHub repo variable `LIFF_ID_{env}`（見 infra/README.md「LINE 頻道設定」）。
PROJECT_ID=nthusa-chatbot
REGION=asia-northeast1
SERVICE=nthu-chatbot-staging
GITHUB_OWNER=NTHU-SA
GITHUB_REPO=NTHU-Chatbot
BRANCH_REGEX='^dev$'
OPENAI_MODEL=gpt-5.6-luna
MAX_INSTANCES=2
# staging 資料可以清掉重來
DELETE_PROTECTION=false
# 前端（Firebase Hosting）：網站 <HOSTING_SITE>.web.app 透過 CORS 呼叫 API_ORIGIN
API_ORIGIN=https://nthu-chatbot-staging-1008940193124.asia-northeast1.run.app
HOSTING_SITE=nthusa-chatbot
# 只有這個 ref 的 GitHub Actions 能以 Workload Identity Federation 部署前端
DEPLOY_REF=refs/heads/dev
# 網路搜尋（只搜 nthu.edu.tw）：每次搜尋另外計費；staging 已開（2026-10-02），隨時可改回 false
WEB_SEARCH_ENABLED=true
